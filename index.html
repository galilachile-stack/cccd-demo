<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCCD Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #e5f3ff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 420px;
    background: #d8ecff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .header {
    text-align: center;
  }
  .header img {
    width: 80px;
  }
  .title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
    color: #c62828;
  }
  .info {
    margin-top: 10px;
    font-size: 16px;
    line-height: 1.6;
  }
  .label {
    font-weight: bold;
  }
  .photo {
    width: 120px;
    height: 150px;
    background: #fff;
    border: 1px solid #aaa;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Quoc_huy_Viet_Nam.svg" alt="Quốc huy" />
      <div>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br/>Độc lập - Tự do - Hạnh phúc</div>
    </div>

    <div class="title">CĂN CƯỚC CÔNG DÂN</div>

    <div class="info">
      <div class="photo"></div>
      <div><span class="label">Họ và tên:</span> NGUYỄN VĂN A</div>
      <div><span class="label">Ngày sinh:</span> 12/05/1990</div>
      <div><span class="label">Giới tính:</span> Nam</div>
      <div><span class="label">Quốc tịch:</span> Việt Nam</div>
      <div><span class="label">Quê quán:</span> Hải Phòng</div>
      <div><span class="label">Nơi thường trú:</span> Hà Nội</div>
      <div><span class="label">Số định danh:</span> 001199000000</div>
    </div>
  </div>
</body>
</html>
