<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCCD Zalo Style</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial;
    background: #f2f6ff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 430px;
    border-radius: 22px;
    padding: 26px;
    background: #ffffff;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    position: relative;
    overflow: hidden;
  }

  /* Background image (mặt trống Đông Sơn) */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('https://raw.githubusercontent.com/galilachile-stack/cccd-demo/f37f08df407baffad15c9a99816be11b91b1d54c/background.jpg') no-repeat center;
    background-size: cover;
    opacity: 0.25;
    z-index: 0;
  }

  .content { position: relative; z-index: 2; }

  .gov-icon {
    width: 70px;
    position: absolute;
    top: 18px;
    right: 18px;
  }

  .title {
    font-size: 18px;
    font-weight: 600;
    color: #777;
    margin-bottom: 6px;
  }

  .value {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 22px;
    color: #000;
  }

  .field-label {
    color: #888;
    font-size: 15px;
    margin-top: 10px;
  }

  .field-value {
    font-size: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="gov-icon" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Quoc_huy_Viet_Nam.svg" />

    <div class="content">
      <div class="title">Số CCCD</div>
      <div class="value">0790 9103 2497</div>

      <div class="title">Số CMND</div>
      <div class="value" style="font-size: 20px;">024 515 129</div>

      <div class="field-label">Họ và tên</div>
      <div class="field-value">Đặng Nguyễn Quốc Việt</div>

      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <div>
          <div class="field-label">Giới tính</div>
          <div class="field-value">Nam</div>
        </div>
        <div>
          <div class="field-label">Ngày sinh</div>
          <div class="field-value">07/08/1991</div>
        </div>
      </div>

      <div class="field-label">Nơi thường trú</div>
      <div class="field-value">15/1, Đường 13, kp4, An Khánh, TP. Thủ Đức, TP. Hồ Chí Minh</div>

      <div class="field-label">Ngày cấp CCCD</div>
      <div class="field-value">21/08/2022</div>
    </div>
  </div>
</body>
</html>
